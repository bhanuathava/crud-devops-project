# MySQL inside the cluster: a StatefulSet with a PersistentVolumeClaim so data
# survives pod restarts, plus a headless Service giving it the DNS name "mysql".
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: crud-app
  labels:
    app: mysql
    app.kubernetes.io/part-of: crud-devops-project
spec:
  clusterIP: None
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: crud-app
  labels:
    app: mysql
    app.kubernetes.io/part-of: crud-devops-project
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: crud-app-secrets, key: DB_ROOT_PASSWORD }
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: crud-app-secrets, key: DB_PASSWORD }
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef: { name: crud-app-config, key: DB_USERNAME }
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef: { name: crud-app-config, key: DB_NAME }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { cpu: "1",  memory: 1Gi }
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
            initialDelaySeconds: 60
            periodSeconds: 10
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
