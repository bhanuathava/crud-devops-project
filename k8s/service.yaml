# NodePort: exposes the app on every node's IP at port 30080. On minikube there is
# no cloud load balancer, so this is the simplest way to reach it from the host
# (`minikube service crud-app -n crud-app --url`). See docs/REPORT.md.
apiVersion: v1
kind: Service
metadata:
  name: crud-app
  namespace: crud-app
  labels:
    app: crud-app
    app.kubernetes.io/part-of: crud-devops-project
spec:
  type: NodePort
  selector:
    app: crud-app
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
